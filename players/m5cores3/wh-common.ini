; Settings shared by every WaveHopper board build — included by
; ./platformio.ini (CoreS3) and ./fire/platformio.ini (Fire) via extra_configs.
;
; Shared by every board env. Version + build are shared too: both boards ship
; from the same commit with the same numbers (tools/release-m5.py publishes
; each board's channel separately).
[wh]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; setup() runs boot sync/OTA on the loop task — verified-TLS handshakes
    ; (mbedtls cert chain) overflow the 8 KB default (stack canary panic).
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; hostByName() clears lwIP's DNS cache without the TCPIP core lock → abort
    ; when a lookup is in flight (found by scripts/fuzz.py) — see src/lwip_fixes.cpp
    -Wl,--wrap=dns_clear_cache
    -DWH_FW_VERSION=\"0.2.8\"
    -DWH_FW_BUILD=10
lib_deps =
    m5stack/M5Unified@^0.2.7
    m5stack/M5GFX@^0.2.9
    bblanchon/ArduinoJson@^7.4.2
    ; ESP32-audioI2S is VENDORED under lib/ (forked from tag 3.4.6) so we can
    ; patch its TS demuxer — see lib/ESP32-audioI2S/WAVEHOPPER-PATCHES.md.
    ; PlatformIO auto-includes lib/*; do NOT re-add the upstream git dep or it
    ; will shadow the fork.
    ; Module Audio (M144, ES8388): pinned by commit — the only tag (0.0.1)
    ; predates the current API entirely.
    https://github.com/m5stack/M5Module-Audio.git#8dd02b3a0feb5351cb0af11d59c14401dc675b55
