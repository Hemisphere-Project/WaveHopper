; WaveHopper — M5Stack Fire build (classic ESP32, 4 MB PSRAM, 16 MB flash,
; 3 buttons). Same sources as the CoreS3 (../src, ../include, ../lib); board
; facts in ../include/board.h. Basic/Gray are NOT supported: no PSRAM, which
; ESP32-audioI2S requires.
;
; Why a separate project with its OWN core_dir: pioarduino's hybrid compile
; (the CoreS3's custom_sdkconfig) keeps ONE global custom-libs slot per
; PlatformIO core, keyed on sdkconfig + MCU. Any other-chip or
; no-custom-sdkconfig build in the same core sees the marker and reinstalls
; the stock framework — wiping the CoreS3's ~15-min rebuild, every switch.
; Isolated here, neither build can touch the other's framework cache.
;
;   cd players/m5cores3/fire && ~/.platformio/penv-py313/bin/platformio run
;   ... -t upload --upload-port /dev/ttyUSB0      (CP2104 UART bridge)
;
; The Fire runs the stock lwIP window (5760): measured fine on 128-256 kbps
; streams (arrival = consumption). Revisit with a custom_sdkconfig HERE (own
; core = own slot) if far hosts starve it.

[platformio]
default_envs = m5stack-fire
core_dir = ~/.platformio-fire
src_dir = ../src
include_dir = ../include
lib_dir = ../lib
data_dir = ../data
extra_configs = ../wh-common.ini

[env:m5stack-fire]
platform = ${wh.platform}
framework = arduino
board = m5stack-fire
board_build.partitions = ../partitions.csv   ; same table as the CoreS3 (16 MB)
board_build.filesystem = littlefs
; Flash QIO @ 80 MHz (PlatformIO's m5stack-fire.json: DIO @ 40 MHz; Arduino's
; own m5stack_fire board: 80 MHz, QIO selectable). Not cosmetic: the AAC
; decoder (faad2, large) executes from flash through the 32 KB cache, and at
; DIO/40 the fetch bandwidth left AAC stations underrunning the I2S DMA
; (The Lot: codec 87% of core 1 → 73% here, underruns → 0). Takes effect via
; the bootloader, i.e. on USB flashing — OTA keeps whatever was flashed.
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
upload_speed = 921600
build_flags =
    ${wh.build_flags}
lib_deps = ${wh.lib_deps}

; Fire bench build — same LAN dev server as m5stack-cores3-dev. Never publish.
[env:m5stack-fire-dev]
extends = env:m5stack-fire
build_flags =
    ${env:m5stack-fire.build_flags}
    -DWH_DEV_INSECURE_HOST=\"192.168.8.76:3111\"
