; WaveHopper M5 firmware — CoreS3 / CoreS3 SE (ESP32-S3, touch) and Fire
; (classic ESP32 + PSRAM, 3 buttons). One codebase, one binary per chip; board
; facts live in include/board.h, selected by the compile target.
;
; Platform is the pioarduino fork pinned by release URL — the official
; `espressif32` platform only ships Arduino core 2.x, which ESP32-audioI2S >= 3.x
; cannot compile against (it needs the IDF 5 I2S driver from Arduino core 3.x).
; Do NOT "simplify" this back to `platform = espressif32`. Upgrades happen by
; deliberately changing the pinned release URL.
;
; ESP32-audioI2S is pinned by git tag because the PlatformIO registry copy
; (esphome/ESP32-audioI2S@2.0.7) is ancient and core-2.x-only.
; M5Unified and M5GFX must be upgraded together — mismatched pairs break builds.

[platformio]
default_envs = m5stack-cores3
; [wh] (platform, shared flags, lib_deps) — shared with the Fire project in fire/
extra_configs = wh-common.ini

[env:m5stack-cores3]
platform = ${wh.platform}
framework = arduino
board = m5stack-cores3            ; also correct for the SE — M5Unified detects it at runtime
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    ${wh.build_flags}
; lwIP TCP receive window. The precompiled Arduino libs ship 5760 B (4 MSS):
; throughput <= window / RTT, i.e. ~20 KB/s to the US Airtime servers (~250 ms
; + wifi latency) — at or below a 192 kbps stream's 24 KB/s, so every wifi
; hiccup drained the cushion and the prebuffer took forever to fill. 16 KB
; lifts that ceiling ~3x (~64 KB/s at 250 ms). NOT bigger: the window is also
; how much a line-rate burst (HLS segments) parks in internal RAM (wifi RX
; buffers + pbufs) — 32 KB measured internal heap 56 KB → 3 KB free / 0 KB max
; block on every segment fetch; 16 KB keeps ≥29 KB / 18 KB. The socket
; mailbox must hold a window's worth of segments too (default 6).
; Setting any of this triggers pioarduino's hybrid compile:
; the framework libs are rebuilt from ESP-IDF once (slow first build) and live
; in the shared framework-arduinoespressif32-libs package — keep it on the
; production env so every env uses the same config (no rebuild ping-pong).
; NOTE: only some libs get replaced — mbedtls options (e.g. moving TLS buffers
; to PSRAM) do NOT take effect: libmbedcrypto.a (esp_mem.c) stays prebuilt.
custom_sdkconfig =
    CONFIG_LWIP_TCP_WND_DEFAULT=16384
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=32
; esp-modbus fails its own static assert under the hybrid compile; the radio
; never uses it.
custom_component_remove =
    espressif/esp-modbus
lib_deps = ${wh.lib_deps}

; Bench-test build: content host redirected to a LAN dev server over plain
; HTTP (php -S serving players/web/public). NEVER publish binaries from this
; env — the OTA/content path is unverified. Usage:
;   pio run -e m5stack-cores3-dev -t upload
[env:m5stack-cores3-dev]
extends = env:m5stack-cores3
; NOTE: to bump version/build for an OTA bench test, write the full flag list
; here explicitly — mixing ${...} inheritance with -U/-D overrides gets
; reordered by PlatformIO and leaves the macros undefined.
build_flags =
    ${env:m5stack-cores3.build_flags}
    -DWH_DEV_INSECURE_HOST=\"192.168.8.76:3111\"
    ; add -DWH_TS_DIAG here to re-enable TS demuxer + HLS segment-fetch diagnostics
